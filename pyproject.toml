[project]
name = "coursework-sql"
version = "0.1.0"
description = ""
authors = [
    {name = "marseilleumirzak",email = "galinaumerzakhova@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "config (>=0.5.1,<0.6.0)"
]


[build-system]
